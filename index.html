 .issue-count{margin-top:8px}
 .closing{gap:12px}.closing h2{font-size:1.05rem}
}

/* 3.5 — page-edge gradients. Both fades belong to the page, not a card.
   Text, original scene, card transparency and brand typography stay unchanged. */
.topbar{
  border-bottom:0;
  background:none;
  box-shadow:none;
}
.topbar::before{
  top:0; bottom:auto;
  height:176px;
  left:50%; width:100vw;
  transform:translateX(-50%);
  background:linear-gradient(to bottom,
    rgba(28,24,20,.72) 0%,
    rgba(28,24,20,.69) 16%,
    rgba(28,24,20,.57) 32%,
    rgba(28,24,20,.38) 48%,
    rgba(28,24,20,.18) 66%,
    rgba(28,24,20,.045) 84%,
    rgba(28,24,20,0) 100%);
  border:0;
  box-shadow:none;
  pointer-events:none;
}
.page-end{
  position:relative;
  isolation:isolate;
  width:100%;
  margin:0;
  background:none;
  border:0;
}
.page-end::before{
  content:'';
  position:absolute;
  top:-112px; right:0; bottom:0; left:0;
  z-index:-1;
  pointer-events:none;
  /* The darkest point is the document's bottom edge; the fade rises upward. */
  background:linear-gradient(to top,
    rgba(24,20,16,.98) 0%,
    rgba(24,20,16,.96) 12%,
    rgba(24,20,16,.87) 28%,
    rgba(24,20,16,.73) 44%,
    rgba(24,20,16,.52) 60%,
    rgba(24,20,16,.29) 76%,
    rgba(24,20,16,.09) 90%,
    rgba(24,20,16,0) 100%);
}
.page-end .closing{
  background:none;
  border:0;
  border-radius:0;
  box-shadow:none;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  margin:0;
  padding:30px 24px 22px;
}
.page-end .closing h2{
  text-shadow:0 1px 5px rgba(20,16,12,.35);
}
.page-end .closing p{
  text-shadow:0 1px 5px rgba(20,16,12,.45);
}
.page-end .footer{
  padding-top:16px;
  padding-bottom:30px;
  background:none;
  border:0;
  box-shadow:none;
}
@media(max-width:768px){
  .topbar::before{height:154px}
  .page-end::before{top:-96px}
  .page-end .closing{padding:28px 22px 20px}
  .page-end .footer{padding-top:14px;padding-bottom:28px}
}
@media print{
  .topbar::before,.page-end{display:none}
}

/* A short issue still reaches the viewport bottom: never leave a bright strip
   after the darkened footer. On long issues it stays in normal document flow. */
body.web{display:flex;flex-direction:column;min-height:100vh;min-height:100svh}
body.web>header.container,body.web>main.container{width:100%}
body.web>.page-end{margin-top:auto;flex-shrink:0}

.cover>.page-end{position:absolute;left:0;right:0;bottom:0}

/* 3.6 — readable title grouping and quiet title light.
   Source labels are not rendered. The two article links have the same visible label.
   Preserve scene brightness, saturation, card alpha, and page-edge gradients. */
.article-main > .article-feature > .article-title > .title-part:first-child{
  padding-right:32px;
}
h2.article-title{
  word-break:normal;
  overflow-wrap:break-word;
  line-break:strict;
  text-wrap:balance;
}
.title-part.context,
.title-part.context-small{
  word-break:normal;
  overflow-wrap:break-word;
  line-break:strict;
  text-wrap:balance;
}
.title-part.focus{
  word-break:normal;
  overflow-wrap:break-word;
  line-break:strict;
  text-wrap:balance;
  text-shadow:
    0 1px 2px rgba(24,18,12,.24),
    0 0 7px rgba(255,224,165,.22),
    0 3px 17px rgba(232,181,77,.28),
    0 7px 28px rgba(232,181,77,.12);
}
/* Only the four-letter wordmark gets a soft warm backlight; the glyphs stay crisp. */
h1{position:relative;isolation:isolate;width:fit-content}
h1::before{
  content:'';
  position:absolute;z-index:-1;pointer-events:none;
  inset:8% -9% -18%;
  background:radial-gradient(ellipse at 47% 64%,
    rgba(255,240,201,.55) 0%,
    rgba(255,233,177,.26) 38%,
    rgba(255,228,165,.08) 61%,
    rgba(255,228,165,0) 80%);
  filter:blur(9px);
}
.masthead-wordmark{
  filter:drop-shadow(0 1px 1px rgba(255,245,219,.60))
         drop-shadow(0 3px 10px rgba(255,226,169,.32));
}
@media print{
 h1::before{display:none}
 .masthead-wordmark{filter:none}
 .title-part.focus{text-shadow:none}
}

/* A short programme name or episode stays intact; narrow columns still wrap
   between the three meaning units, never between a number and its label. */
.title-unit{display:inline-block;max-width:100%;vertical-align:baseline}
</style></head>

  function realIssueUrl() {

  function showCopyDialog(text) {

    $('#copy-text').focus(); $('#copy-text').select();
